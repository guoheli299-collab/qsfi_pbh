[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qsfi-pbh"
version = "0.13.0"
description = "Reproducible QSFI-PBH figure calculations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.14.1",
  "matplotlib==3.10.3",
  "mpmath==1.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qsfi_pbh*"]
